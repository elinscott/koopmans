# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

sphinx:
  # Path to your Sphinx configuration file, required as of
  # https://about.readthedocs.com/blog/2024/12/deprecate-config-files-without-sphinx-or-mkdocs-config/
  configuration: docs/source/conf.py

# Set the version of Python and other tools you might need
build:
  os: ubuntu-22.04
  apt_packages:
    - graphviz
  tools:
    python: "3.12"

  # adapted from uv recipe at https://docs.readthedocs.io/en/stable/build-customization.html#install-dependencies-with-uv
  # and comment at https://github.com/readthedocs/readthedocs.org/issues/11289#issuecomment-2103832834
  commands:
    # Read the Docs shallow-clones this repo by default; hatch-vcs needs the
    # full history (including tags) to compute the git-derived package
    # version installed below. `build.jobs.post_checkout` would be the usual
    # place for this, but Read the Docs rejects combining `build.jobs` with
    # `build.commands` ("config:build:jobs-and-commands"), so it runs here
    # instead, as the first command.
    - git fetch --unshallow || true
    - asdf plugin add uv
    - asdf install uv latest
    - asdf global uv latest
    # Clone the fork dependencies that [tool.uv.sources] points at as sibling
    # checkouts (mirrors the clone step in .github/workflows/tests.yml — keep
    # the two lists in sync, and drop entries as forks merge upstream).
    # Each clone removes its destination first: Read the Docs reuses build
    # environments, and a leftover sibling checkout makes `git clone` exit 128
    # ("destination path already exists") before Sphinx ever runs.
    - rm -rf ../aiida-koopmans2 && git clone --depth 1 https://github.com/elinscott/aiida-koopmans ../aiida-koopmans2
    - rm -rf ../aiida-workgraph && git clone --depth 1 --branch patched https://github.com/elinscott/aiida-workgraph ../aiida-workgraph
    - rm -rf ../node-graph && git clone --depth 1 --branch patched https://github.com/elinscott/node-graph ../node-graph
    - rm -rf ../plumpy && git clone --depth 1 --branch patched https://github.com/elinscott/plumpy ../plumpy
    - rm -rf ../aiida-wannier90-workflows && git clone --depth 1 --branch patched https://github.com/elinscott/aiida-wannier90-workflows ../aiida-wannier90-workflows
    - rm -rf ../aiida-wannierjl && git clone --depth 1 https://github.com/elinscott/aiida-wannierjl ../aiida-wannierjl
    - rm -rf ../aiida-quantumespresso && git clone --depth 1 --branch patched https://github.com/elinscott/aiida-quantumespresso ../aiida-quantumespresso
    - rm -rf ../pydantic_espresso && git clone --depth 1 https://github.com/elinscott/pydantic-espresso ../pydantic_espresso
    - rm -rf ../upf-tools && git clone --depth 1 https://github.com/pseudopotential-tools/upf-tools ../upf-tools
    - git init -q ../aiida-core && git -C ../aiida-core fetch --depth 1 https://github.com/aiidateam/aiida-core 4c81e9d64ac561325b91c7e6a18ea2cf792e0609 && git -C ../aiida-core checkout -q FETCH_HEAD
    - uv venv $READTHEDOCS_VIRTUALENV_PATH
    - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH uv pip install --group docs .
    - python -m sphinx -T -b html -d docs/_build/doctrees -D language=en docs/source $READTHEDOCS_OUTPUT/html
