# The macroscopic dielectric constant of bulk silicon, from ph.x.

workflow:
  task: dft_eps                   # scf, then ph.x with epsil = true, trans = false, at q = Gamma
  pseudo_library: PseudoDojo/0.4/LDA/SR/standard/upf

atoms:
  cell_parameters:
    periodic: true                 # a crystal, not an isolated molecule
    ibrav: 2                      # face-centered cubic
    celldms:
      1: 10.2622                  # the lattice parameter, in bohr
  atomic_positions:
    units: crystal
    positions:                    # the two-atom diamond basis
      - [Si, 0.00, 0.00, 0.00]
      - [Si, 0.25, 0.25, 0.25]

kpoints:
  grid: [4, 4, 4]                 # the dielectric constant converges slowly with this

calculator_parameters:
  ecutwfc: 60.0                   # wavefunction cutoff (Ry)
