# Ozone as in ozone.yaml, with the KIPZ correction in place of KI.

workflow:
  task: singlepoint
  correction: kipz
  screening_method: dscf
  init_orbitals: kohn-sham
  alpha_numsteps: 1
  pseudo_library: SG15/1.2/PBE/SR

atoms:
  cell_parameters:
    vectors:
      - [8.1738, 0.0, 0.0]
      - [0.0, 6.0, 0.0]
      - [0.0, 0.0, 6.66]
    units: angstrom
    periodic: false
  atomic_positions:
    units: angstrom
    positions:
      - [O, 4.0869, 3.0, 2.89]
      - [O, 5.1738, 3.0, 3.55]
      - [O, 3.0, 3.0, 3.55]

calculator_parameters:
  ecutwfc: 50.0
  nbnd: 10
  kcp:
    system:
      ecutrho: 200.0
