# The KI@LDA band structure of bulk GaAs without spin-orbit coupling, for comparison
# with gaas.yaml. The screening parameters below were computed beforehand by linear
# response in the primitive cell.

workflow:
  task: singlepoint
  correction: ki
  formalism: dfpt                 # linear response in the primitive cell
  init_orbitals: mlwfs            # maximally localized Wannier functions
  spin: none                      # no spin-orbit coupling; the pseudopotentials are averaged over j
  pseudo_library: LDA-FR-GaAs     # LDA, fully relativistic, norm-conserving; installed by hand
  calculate_alpha: false          # use the screening parameters below instead of computing them
  alpha_guess:                    # one value per Wannier function, in projection-block order
    - 0.33529                     # As 3d (orbitals 1-5)
    - 0.33529
    - 0.33529
    - 0.33529
    - 0.33529
    - 0.31837                     # Ga 3d (orbitals 6-10; crystal-field split into two groups)
    - 0.31605
    - 0.31605
    - 0.31837
    - 0.31605
    - 0.17130                     # As sp3, the four valence bands (orbitals 11-14)
    - 0.17130
    - 0.17130
    - 0.17130
    - 0.09136                     # Ga sp3, the four lowest conduction bands (orbitals 15-18)
    - 0.09136
    - 0.09136
    - 0.09136

atoms:
  cell_parameters:
    periodic: true
    ibrav: 2                      # face-centered cubic
    celldms:
      1: 10.6807                  # the lattice parameter, in bohr
  atomic_positions:
    units: crystal
    positions:                    # the two-atom zincblende basis
      - [Ga, 0.00, 0.00, 0.00]
      - [As, 0.25, 0.25, 0.25]

kpoints:
  grid: [4, 4, 4]                 # the Brillouin-zone sampling
  path: LGXWLKG                   # the path a band structure is plotted along

calculator_parameters:
  ecutwfc: 70.0                   # wavefunction cutoff (Ry)
  nbnd: 30                        # 14 filled bands, and empties to disentangle among
  wannier90:
    projections:                  # one entry per block of bands: three filled, then one empty
      - [{site: As, ang_mtm: "l=2"}]      # As 3d
      - [{site: Ga, ang_mtm: "l=2"}]      # Ga 3d
      - [{site: As, ang_mtm: sp3}]        # the four valence bands
      - [{site: Ga, ang_mtm: sp3}]        # the four lowest conduction bands
    dis_win_max: 23.0             # the states the empty block may mix
    dis_froz_max: 14.5            # the states it must keep whole

parallelization:
  kcw:
    ntasks: 4                     # MPI ranks for each kcw.x job
    npool: 4                      # k-point pools, on the Wannier-gauge and screening steps
